name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.platform.name }} / Go ${{ matrix.go }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        go: ['1.27.1', stable]
        platform:
          - name: Linux / x86_64
            runner: ubuntu-latest
          - name: Linux / arm64
            runner: ubuntu-24.04-arm
          - name: Windows / x86_64
            runner: windows-latest
          - name: macOS / arm64
            runner: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Check formatting
        if: runner.os == 'Linux' && matrix.go == 'stable' && matrix.platform.name == 'Linux / x86_64'
        shell: bash
        run: |
          files=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$files" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$files"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Test with the race detector
        if: runner.os != 'Windows'
        run: go test ./... -race -count=1
